<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GoldBarn</title>
    <link rel="stylesheet" href="Frontend.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="title">
    <h1>GoldBarn</h1>
    <p>Where your metals stay meaningful</p>
</div>

<div class="info2">

    <div class="marginL">

        <div class="row1">

            <div class="C1">
                <h4>precision</h4>
                <p id="accuracy-metric">0.0%</p>
            </div>

            <div class="C2">
                <h4>error</h4>
                <p id="error-metric">0.00%</p>
            </div>

            <div class="C2">
                <h4>history</h4>
                <p id="samples-metric">0</p>
            </div>

        </div>

        <div class="info3">

            <div class="chartTop">
                <div>LIVE</div>

                <div class="buttons">
                    <button class="btn active" data-range="1w">1W</button>
                    <button class="btn" data-range="1m">1M</button>
                    <button class="btn" data-range="6m">6M</button>
                </div>
            </div>

            <div class="chartBox">
                <canvas id="historicalTrends"></canvas>
            </div>

        </div>

        <div class="info4">

            <h3>Saved History</h3>

            <div class="scroll">

                <table>
                    <thead>
                    <tr>
                        <th>Time at</th>
                        <th>Saved Gold</th>
                        <th>Saved Silver</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody id="table-body"></tbody>
                </table>

            </div>

        </div>

    </div>

    <div class="rightL">

        <h2>settings</h2>

        <div class="liveBox">

            <div class="liveTitle">SAVED LIVE</div>

            <div class="priceRow">
                <span>recorded gold price:</span>

                <span>
                    <span id="gold-cost">0.00</span>
                    <span id="gold-signal" class="signal-badge">--</span>
                </span>
            </div>

            <div class="priceRow">
                <span>recorded silver price:</span>

                <span>
                    <span id="silver-cost">0.00</span>
                    <span id="silver-signal" class="signal-badge">--</span>
                </span>
            </div>

        </div>

        <div class="input1">
            <label>refresh rate</label>

            <select id="polling-rate-select">
                <option value="2000">2s - High Speed</option>
                <option value="4000" selected>4s - Normal Speed</option>
                <option value="10000">10s - Low Speed</option>
            </select>
        </div>

        <div class="input1">
            <label>metal</label>

            <select id="asset-select">
                <option value="gold">Gold Balance</option>
                <option value="silver">Silver Balance</option>
            </select>
        </div>

        <div class="input1">
            <label>weight</label>

            <input
                    type="number"
                    id="asset-amount"
                    value="1"
                    min="0"
                    step="any"
            >
        </div>

        <div class="input1">
            <label>currency</label>

            <select id="currency-select">
                <option value="AED">AED - Dirham</option>
                <option value="GBP">GBP - Pound</option>
                <option value="CAD">CAD - Dollar</option>
                <option value="EUR">EUR - Euro</option>
            </select>
        </div>

        <div class="total">
            <div>Total</div>
            <p id="conversion-display">Dhs 0.00</p>
        </div>

    </div>

</div>

<script src="Homepage.js"></script>

</body>
</html>
